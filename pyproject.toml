[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-rbac-scope-review"
version = "0.1.0"
description = "Offline review of Azure RBAC assignment scope and privileged roles"
requires-python = ">=3.10"
authors = [{name = "UGarvicu"}]

[project.scripts]
rbac-scope-review = "azure_rbac_scope_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
